name: Test and release desktop launcher

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Unit, lifecycle, and desktop smoke tests
        env:
          CROSSKEY_GUI_TESTS: '1'
        run: python -m unittest discover -v

  windows-package:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python build_executable.py windows
      - name: Package portable Windows folder
        shell: pwsh
        run: |
          Copy-Item README.md dist/CrossKey-Windows/README.md
          Compress-Archive -Path dist/CrossKey-Windows -DestinationPath "CrossKey-Windows-$env:GITHUB_REF_NAME.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: CrossKey-Windows-*.zip
          if-no-files-found: error

  publish:
    needs: windows-package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: release
      - name: Publish verified tag and Windows package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/*.zip --verify-tag --title "CrossKey $RELEASE_TAG" --notes-file RELEASE_NOTES.md
